general {
    gaps_in = 6
    gaps_out = 5

    border_size = 1

    col.active_border = rgba(F54927FF) rgba(820303FF) 45deg
    col.inactive_border = rgba(171717FF)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1
    inactive_opacity = 0.75
    fullscreen_opacity = 1
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
}

